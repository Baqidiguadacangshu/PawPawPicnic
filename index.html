<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paw Paw Picnic · A little world in a box</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faeee9;color:#674e52;font-family:Arial,"PingFang SC",sans-serif;overflow:hidden}#game{position:fixed;inset:0}canvas{display:block;touch-action:none}header{position:absolute;top:28px;left:32px;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:3px;color:#987579}h1{font-family:Georgia,serif;font-size:clamp(26px,4vw,48px);font-weight:normal;margin:10px 0 6px}header p{font-size:12px;margin:0;color:#97777a}.panel{background:#fffaf3ed;border:1px solid #fff;border-radius:22px;box-shadow:0 8px 32px #95657514}.mission{position:absolute;top:28px;right:28px;padding:18px 22px;width:230px}.mission small{letter-spacing:2px;font-size:10px}#score{font-size:24px;margin:10px 0}progress{width:100%;height:7px;accent-color:#d98b9e}#instructions{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:15px 25px;text-align:center;font-size:12px;white-space:nowrap}#hint{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#fffaf3ee;padding:12px 22px;border-radius:30px;font-size:14px;max-width:90%;text-align:center}button{font:inherit;color:#73555d;border:1px solid #e8c4ca;background:#fff7ef;border-radius:12px;padding:10px 14px;cursor:pointer}button:hover{background:#f7dbe2}button:focus-visible{outline:3px solid #a16b81;outline-offset:3px}.tools{display:flex;gap:7px;margin-top:13px;font-size:11px}#finish{position:absolute;inset:0;display:grid;place-items:center;background:#6f4b5925;backdrop-filter:blur(3px)}#finish[hidden]{display:none}.card{padding:36px;text-align:center;max-width:90vw}.card h2{font-family:Georgia,serif;font-size:32px}.card p{line-height:1.8;font-size:14px}#touch{display:none;position:absolute;bottom:95px;left:20px;grid-template-columns:repeat(3,44px);gap:4px}#touch button{padding:12px 0;touch-action:none;user-select:none}#collect{position:absolute;bottom:120px;right:22px;display:none}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#faeee9;z-index:10;text-align:center;padding:30px}#loading[hidden]{display:none}@media(max-width:650px){header{top:20px;left:18px}header p{max-width:180px;line-height:1.5}.mission{top:125px;right:16px;width:180px;padding:13px}#instructions{bottom:16px;font-size:10px;padding:12px;white-space:normal;width:90%}#hint{bottom:70px;font-size:12px;width:max-content;max-width:90%}.eyebrow{font-size:9px}#touch{display:grid}#collect{display:block}}@media(pointer:coarse){#touch{display:grid}#collect{display:block}}
</style>
</head><body>
<div id="game" aria-label="Paw Paw Picnic 三维游戏"></div>
<header><div class="eyebrow">A LITTLE WORLD IN A BOX · 03</div><h1>Paw Paw Picnic</h1><p>把小小的快乐，装进一场野餐。</p></header>
<section class="mission panel"><small>TODAY’S LITTLE MISSION</small><div id="score" aria-live="polite">🍓 0 / 6</div><progress id="progress" max="6" value="0" aria-label="草莓收集进度"></progress><div class="tools"><button id="replay">重新开始</button><button id="lidReplay">再看开盒</button></div></section>
<div id="hint" role="status">正在打开你的小花园…</div>
<div id="instructions" class="panel">W A S D / 方向键 移动　·　E 收集　·　拖动旋转视角　·　滚轮缩放</div>
<div id="touch" aria-label="移动控制"><span></span><button data-key="KeyW" aria-label="向前">↑</button><span></span><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="向后">↓</button><button data-key="KeyD" aria-label="向右">→</button></div><button id="collect">收集 🍓</button>
<div id="finish" hidden><div class="card panel" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div style="font-size:42px">🍓 🐶 🌷</div><h2 id="winTitle">Picnic is ready!</h2><p>六颗草莓，一盒快乐。<br>小狗的野餐准备好啦，谢谢你！</p><button id="again">再玩一次</button></div></div>
<div id="loading">正在准备粉彩小世界…</div>
<script type="module">import('./game.js').catch(error=>{console.error(error);const el=document.querySelector('#loading');el.hidden=false;el.textContent='游戏加载失败。请使用 Live Server 打开，并确认网络可以访问 jsDelivr。';});</script>
</body></html>
